[project]
name = "osl-ankle-demo"
version = "0.1.0"
description = "Safe, low-impedance interactive demo for the Open Source Leg ankle."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Louis Devillez", email = "louis.devillez@gmail.com" }]
# opensourceleg pins numpy<2, which has no wheels for Python 3.13+
requires-python = ">=3.11,<3.13"
dependencies = [
    "opensourceleg[dephy]>=3.5,<4",
    "pyudev>=0.24",
    "pyyaml>=6.0",
]

[project.scripts]
osl-ankle-demo = "osl_ankle_demo.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
